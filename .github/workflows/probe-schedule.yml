# Temporary: checks that GitHub fires scheduled workflows on this account (slop-factory#374). Removed after the test.
name: probe-schedule
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "scheduled tick ${{ github.event_name }}"
