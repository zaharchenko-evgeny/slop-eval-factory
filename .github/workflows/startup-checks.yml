name: Startup checks

on:
  push:
  pull_request:

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - run: bash -n .air/cloud/startup.sh roles/*/setup.sh
      - run: uvx --quiet --from shellcheck-py==0.10.0.1 shellcheck .air/cloud/startup.sh roles/*/setup.sh
      - name: factory validate
        run: uvx --quiet --from "$(sed -n 's/^engine: *"\{0,1\}\([^" #]*\).*/\1/p' factory.yaml)" factory validate --team .
